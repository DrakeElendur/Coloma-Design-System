<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../tokens/dist/css/variables.css">
    <title>Document</title>
    <style>
        .botones {
            display: flex;
            flex-direction: row;
            justify-items: center;
            align-items: center;
            gap: 12px;
        }
        body {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
    </style>
</head>
<body>
    <div class="botones">
        <coloma-button >Sin atributo</coloma-button>
        <coloma-button variant="primary">Guardar</coloma-button>
        <coloma-button variant="secondary">Cancelar</coloma-button>
        <coloma-button variant="ghost">Acción</coloma-button>
        <coloma-button variant="link">Enlace</coloma-button>
        
    </div>
    <div class="botones">
        <coloma-button disabled>Sin atributo</coloma-button>
        <coloma-button variant="primary" disabled>Guardar</coloma-button>
        <coloma-button variant="secondary" disabled>Cancelar</coloma-button>
        <coloma-button variant="ghost" disabled>Acción</coloma-button>
        <coloma-button variant="link" disabled>Enlace</coloma-button>
        
    </div>
    <fieldset disabled class="botones">
        <coloma-button >Sin atributo</coloma-button>
        <coloma-button variant="primary">Guardar</coloma-button>
        <coloma-button variant="secondary">Cancelar</coloma-button>
        <coloma-button variant="ghost">Acción</coloma-button>
        <coloma-button variant="link">Enlace</coloma-button>
        
    </fieldset>
    <script type="module" src="../components/button/coloma-button.js"></script>
</body>
</html>
